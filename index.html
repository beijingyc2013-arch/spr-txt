<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Spraak naar tekst</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#080a0f,#181d29);color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}
.app{width:min(720px,100%);padding:28px;background:#11151d;border:1px solid #29303d;border-radius:24px;box-shadow:0 25px 70px #0009}
h1{margin:0 0 6px;font-size:clamp(26px,6vw,36px)}
.status{margin:0 0 20px;color:#929baa;min-height:24px}
#text{min-height:270px;padding:20px;background:#090c12;border:1px solid #29303a;border-radius:16px;font-size:18px;line-height:1.65;white-space:pre-wrap;overflow:auto}
.controls{display:flex;gap:12px;margin-top:16px}
button{flex:1;padding:15px;border:0;border-radius:14px;color:#fff;background:#282e39;font:700 16px system-ui;cursor:pointer;transition:.2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}
button:active:not(:disabled){transform:scale(.98)}
#start{background:linear-gradient(135deg,#4f7cff,#765cff)}
button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:500px){.app{padding:20px}.controls{flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<h1>Spraak naar tekst</h1>
<p class="status" id="status">Klaar om te luisteren</p>
<div id="text" aria-live="polite"></div>
<div class="controls">
<button id="start" type="button">Microfoon starten</button>
<button id="stop" type="button" disabled>Stoppen</button>
</div>
</main>

<script>
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const text=document.getElementById("text"),status=document.getElementById("status"),start=document.getElementById("start"),stop=document.getElementById("stop");

if(!Recognition){
 status.textContent="Gebruik Chrome of Edge voor spraakherkenning.";
 start.disabled=true;
}else{
 const recognition=new Recognition();
 let listening=false,restarting=false;

 recognition.lang="nl-NL";
 recognition.continuous=true;
 recognition.interimResults=true;
 recognition.maxAlternatives=1;

 recognition.onstart=()=>{
  restarting=false;
  status.textContent="Luistert naar de microfoon…";
  start.disabled=true;
  stop.disabled=false;
 };

 recognition.onresult=e=>{
  let finalText="",interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+" ";
   else interim+=e.results[i][0].transcript;
  }
  if(finalText)text.textContent+=finalText;
  if(listening)status.textContent=interim?"Luistert: "+interim:"Luistert naar de microfoon…";
 };

 recognition.onerror=e=>{
  if(e.error==="not-allowed"||e.error==="service-not-allowed"){
   listening=false;
   status.textContent="Microfoontoegang is geblokkeerd. Sta de microfoon toe voor deze site.";
   start.disabled=false;
   stop.disabled=true;
   return;
  }
  if(e.error==="no-speech")status.textContent="Geen spraak gedetecteerd. Ik blijf luisteren.";
 };

 recognition.onend=()=>{
  if(listening){
   restarting=true;
   status.textContent="Luisteren wordt hervat…";
   setTimeout(()=>{
    if(listening)try{recognition.start()}catch{}
   },250);
  }else{
   start.disabled=false;
   stop.disabled=true;
   status.textContent="Klaar om te luisteren";
  }
 };

 start.onclick=()=>{
  listening=true;
  start.disabled=true;
  stop.disabled=false;
  status.textContent="Microfoon wordt gestart…";
  try{recognition.start()}
  catch{status.textContent="De browser kon de spraakherkenning niet starten.";listening=false;start.disabled=false;stop.disabled=true}
 };

 stop.onclick=()=>{
  listening=false;
  recognition.stop();
  status.textContent="Stoppen…";
 };
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
